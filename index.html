<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Braces Countdown</title>

https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top left,#3a4d7c 0%,transparent 40%),
        radial-gradient(circle at bottom right,#5d4a7d 0%,transparent 40%),
        #0f172a;
    color:white;
}

.container{
    width:min(900px,90%);
    padding:50px;
    border-radius:32px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 15px 50px rgba(0,0,0,0.35);
    text-align:center;
}

.subtitle{
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:.85rem;
    color:rgba(255,255,255,.65);
    margin-bottom:14px;
}

h1{
    font-size:3rem;
    font-weight:700;
    margin-bottom:12px;
}

.target-date{
    color:rgba(255,255,255,.75);
    margin-bottom:40px;
}

.countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    padding:30px 15px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    transition:.3s ease;
}

.card:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,0.08);
}

.number{
    font-size:3.5rem;
    font-weight:700;
    line-height:1;
}

.label{
    margin-top:10px;
    color:rgba(255,255,255,.65);
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:.85rem;
}

.footer{
    margin-top:35px;
    color:rgba(255,255,255,.7);
    font-size:1rem;
}

@media(max-width:700px){
    .countdown{
        grid-template-columns:repeat(2,1fr);
    }

    h1{
        font-size:2.2rem;
    }

    .number{
        font-size:2.6rem;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="subtitle">Braces Removal Countdown</div>

    <h1>Days Until Braces Come Off</h1>

    <div class="target-date">
        October 7, 2028 · 10:45 AM
    </div>

    <div class="countdown">
        <div class="card">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="card">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="card">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="card">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>
    </div>

    <div class="footer" id="footer">
        One day closer.
    </div>
</div>

<script>
const target = new Date("October 7, 2028 10:45:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = target - now;

    if (distance <= 0) {
        document.querySelector(".container").innerHTML = `
            <h1>Countdown Complete</h1>
            <div class="footer" style="margin-top:20px;">
                Your braces removal date has arrived.
            </div>
        `;
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
