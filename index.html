<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waypoint Bot - Home</title>

<style>
    /* Animated gradient background */
    body {
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
        background: linear-gradient(135deg, #ffffff, #dfe9f3, #ffffff);
        background-size: 400% 400%;
        animation: gradientMove 18s ease infinite;
        color: #fff;
    }
    @keyframes gradientMove {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    /* Navigation */
    nav {
        backdrop-filter: blur(12px);
        background: rgba(255,255,255,0.15);
        padding: 15px 30px;
        display: flex;
        gap: 25px;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    nav a {
        color: #000;
        font-weight: 600;
        text-decoration: none;
        transition: 0.3s;
    }
    nav a:hover {
        color: #444;
    }

    /* Main container */
    .container {
        max-width: 900px;
        margin: 150px auto;
        text-align: center;
        padding: 40px;
        backdrop-filter: blur(20px);
        background: rgba(255,255,255,0.25);
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        color: #000;
    }
    p {
        font-size: 1.2rem;
        color: #222;
    }

    /* Buttons */
    .btn {
        display: inline-block;
        margin: 20px;
        padding: 15px 35px;
        background: #000;
        color: #fff;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
        box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .btn:hover {
        background: #222;
        transform: translateY(-3px);
    }
</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="tos.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
</nav>

<div class="container">
    <h1>Waypoint Bot</h1>
    <p>Your server’s navigation assistant.</p>

    <a class="btn" href="https://discord.gg/3QV3XEteHx">Support Server</a>
    <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1542990189566099606&permissions=8&integration_type=0&scope=bot+applications.commands">Invite Bot</a>
</div>

</body>
</html>
