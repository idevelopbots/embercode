<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Yellow Gradient Background */
      background: linear-gradient(135deg, #fff200 0%, #ffd700 50%, #ffae00 100%);
      font-family: 'Arial Black', Impact, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Caution Tape Lines */
    .caution-tape {
      width: 100%;
      height: 60px;
      background: repeating-linear-gradient(
        -45deg,
        #111,
        #111 30px,
        #ffcc00 30px,
        #ffcc00 60px
      );
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      position: absolute;
    }

    .tape-top {
      top: 15%;
      transform: rotate(-3deg) scaleX(1.1);
    }

    .tape-bottom {
      bottom: 15%;
      transform: rotate(3deg) scaleX(1.1);
    }

    /* Big Red Sign Banner */
    .sign-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 60px;
      border: 8px solid #111;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
      z-index: 10;
    }

    /* Big Red Letters */
    .construction-text {
      color: #e60000;
      font-size: clamp(2.5rem, 8vw, 6rem);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 3px 3px 0px #000;
      line-height: 1.1;
    }
  </style>
</head>
<body>

  <div class="caution-tape tape-top"></div>

  <div class="sign-container">
    <h1 class="construction-text">UNDER-CONSTRUCTION</h1>
  </div>

  <div class="caution-tape tape-bottom"></div>

</body>
</html>
