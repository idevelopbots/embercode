<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waypoint Bot - Home</title>

<style>
/* ===== GLOBAL RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ===== BACKGROUND ANIMATION ===== */
body {
    font-family: "Inter", sans-serif;
    height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(circle at top left, #ffffff, #dfe9f3, #cfd9df, #e2ebf0);
    animation: bgMove 20s infinite alternate ease;
}

@keyframes bgMove {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
}

/* ===== FLOATING PARTICLES ===== */
.particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: float 12s infinite ease-in-out;
}

@keyframes float {
    0% { transform: translateY(0) translateX(0); opacity: 0.4; }
    50% { opacity: 1; }
    100% { transform: translateY(-200px) translateX(80px); opacity: 0.2; }
}

/* Generate particles */
.particle:nth-child(1) { top: 80%; left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { top: 60%; left: 30%; animation-delay: 2s; }
.particle:nth-child(3) { top: 70%; left: 50%; animation-delay: 4s; }
.particle:nth-child(4) { top: 85%; left: 70%; animation-delay: 1s; }
.particle:nth-child(5) { top: 65%; left: 90%; animation-delay: 3s; }

/* ===== NAVIGATION ===== */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px 40px;
    display: flex;
    gap: 30px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.15);
    border-bottom: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

nav a {
    color: #000;
    font-weight: 600;
    text-decoration: none;
    font-size: 1.1rem;
    transition: 0.3s;
}

nav a:hover {
    color: #444;
    transform: translateY(-2px);
}

/* ===== MAIN PANEL ===== */
.container {
    max-width: 900px;
    margin: 180px auto;
    padding: 50px;
    text-align: center;
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.25);
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    transition: transform 0.4s ease;
}

.container:hover {
    transform: scale(1.02);
}

h1 {
    font-size: 3.5rem;
    margin-bottom: 15px;
    color: #000;
    text-shadow: 0 2px 10px rgba(255,255,255,0.7);
}

p {
    font-size: 1.3rem;
    color: #222;
    margin-bottom: 30px;
}

/* ===== BUTTONS ===== */
.btn {
    display: inline-block;
    margin: 20px;
    padding: 18px 40px;
    background: #000;
    color: #fff;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    transition: 0.3s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: 2px solid transparent;
}

.btn:hover {
    background: #222;
    transform: translateY(-5px);
    border-color: #fff;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<!-- Floating particles -->
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<nav>
    <a href="index.html">Home</a>
    <a href="tos.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
</nav>

<div class="container">

    <p>Your server’s navigation assistant.</p>

</div>

</body>
</html>
