<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canvas</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/Rp57bbB2/COASTLINE-8.png">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --white: rgba(255,255,255,.85);
            --border: rgba(0,0,0,.12);
            --text: #1a1a1a;
        }

        body{
            min-height:100vh;
            overflow:hidden;
            font-family:Inter, Segoe UI, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
        }

        /* Animated Rainbow Background */

        .background{
            position:fixed;
            inset:0;
            z-index:-2;

            background:
                linear-gradient(
                    -45deg,
                    #ffd6e7,
                    #ffe2c2,
                    #fff5b8,
                    #dcffd7,
                    #d6f1ff,
                    #e3d6ff,
                    #ffd6f5
                );

            background-size:400% 400%;
            animation:gradientFlow 18s ease infinite;
        }

        .blob{
            position:absolute;
            border-radius:50%;
            filter:blur(80px);
            opacity:.55;
            mix-blend-mode:screen;
        }

        .blob1{
            width:500px;
            height:500px;
            background:#ffb7d9;
            top:-150px;
            left:-100px;
            animation:float1 18s ease-in-out infinite;
        }

        .blob2{
            width:450px;
            height:450px;
            background:#b9e7ff;
            right:-100px;
            top:20%;
            animation:float2 20s ease-in-out infinite;
        }

        .blob3{
            width:500px;
            height:500px;
            background:#dfffc5;
            bottom:-200px;
            left:30%;
            animation:float3 22s ease-in-out infinite;
        }

        .blob4{
            width:420px;
            height:420px;
            background:#efcfff;
            top:40%;
            left:50%;
            animation:float4 17s ease-in-out infinite;
        }

        /* Navigation */

        .navbar{
            position:fixed;
            top:24px;
            left:50%;
            transform:translateX(-50%);

            display:flex;
            justify-content:space-between;
            align-items:center;

            width:min(95%, 1000px);

            padding:14px 22px;

            background:rgba(255,255,255,.75);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,.35);
            border-radius:999px;

            box-shadow:
                0 12px 30px rgba(0,0,0,.08);

            z-index:100;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:12px;
            text-decoration:none;
            color:#000;
            font-weight:800;
            font-size:1.1rem;
        }

        .brand img{
            width:36px;
            height:36px;
            object-fit:contain;
        }

        .nav-links{
            display:flex;
            gap:10px;
        }

        .nav-links a{
            text-decoration:none;
            color:#222;
            font-weight:600;
            padding:10px 16px;
            border-radius:999px;
            transition:.25s;
        }

        .nav-links a:hover{
            background:rgba(255,255,255,.8);
        }

        /* Hero */

        .hero{
            text-align:center;
            z-index:5;
            padding:20px;
        }

        .hero h1{
            font-size:clamp(3rem, 8vw, 6rem);
            font-weight:900;
            color:white;
            line-height:1;
            letter-spacing:-0.05em;
            text-shadow:0 10px 30px rgba(0,0,0,.12);
            margin-bottom:18px;
        }

        .hero p{
            color:rgba(255,255,255,.9);
            font-size:1.2rem;
            margin-bottom:35px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:16px;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            padding:16px 34px;
            border-radius:999px;
            font-weight:700;
            font-size:1rem;
            transition:.3s ease;
        }

        .btn-primary{
            color:#fff;
            background:#5865F2;
            box-shadow:0 10px 25px rgba(88,101,242,.35);
        }

        .btn-primary:hover{
            transform:translateY(-3px);
            background:#4e5ae6;
        }

        .btn-secondary{
            background:rgba(255,255,255,.85);
            color:#111;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .btn-secondary:hover{
            transform:translateY(-3px);
            background:white;
        }

        @keyframes gradientFlow{
            0%{
                background-position:0% 50%;
            }
            50%{
                background-position:100% 50%;
            }
            100%{
                background-position:0% 50%;
            }
        }

        @keyframes float1{
            50%{ transform:translate(180px,120px); }
        }

        @keyframes float2{
            50%{ transform:translate(-180px,-80px); }
        }

        @keyframes float3{
            50%{ transform:translate(120px,-120px); }
        }

        @keyframes float4{
            50%{ transform:translate(-140px,100px); }
        }

        @media (max-width: 768px){

            .navbar{
                padding:12px 16px;
            }

            .nav-links{
                gap:4px;
            }

            .nav-links a{
                padding:8px 10px;
                font-size:.9rem;
            }

            .brand span{
                display:none;
            }
        }
    </style>
</head>
<body>

    <div class="background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
        <div class="blob blob4"></div>
    </div>

    <nav class="navbar">
        <a href="#" class="brand">
            <img
                src="https://i.ibb.co/Rp57bbB2/COASTLINE-8.png"
                alt="Canvas Logo"
            >
            <span>Canvas</span>
        </a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/terms">Terms of Service</a>
            <a href="/privacy">Privacy Policy</a>
        </div>
    </nav>

    <main class="hero">
        <h1>Give your server a paint job</h1>

        <p>Transform your Discord server with Canvas.</p>

        <div class="buttons">
            <a
                class="btn btn-primary"
                href="https://discord.com/oauth2/authorize?client_id=1573438461489188976&permissions=8&integration_type=0&scope=applications.commands+bot"
                target="_blank"
                rel="noopener noreferrer"
            >
                Invite
            </a>

            <a
                class="btn btn-secondary"
                href="https://discord.gg/GQ58Nk2hKD"
                target="_blank"
                rel="noopener noreferrer"
            >
                Support
            </a>
        </div>
    </main>

</body>
</html>
