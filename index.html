<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas</title>
<style>
  :root {
    --bg: #14161a;
    --card: #ffffff;
    --text: #1a1a1a;
    --tape-yellow: #ffd400;
    --tape-black: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root { --card: #22252b; --text: #f2f2f2; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  /* Caution tape */
  .tape {
    position: fixed; left: -10%; width: 120%; height: 56px;
    background: repeating-linear-gradient(
      -45deg,
      var(--tape-yellow) 0 28px,
      var(--tape-black) 28px 56px
    );
    background-size: 79.2px 79.2px;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
    animation: slide 2s linear infinite;
    z-index: 1;
  }
  .tape.t1 { top: 14%; transform: rotate(-6deg); }
  .tape.t2 { bottom: 14%; transform: rotate(5deg); animation-direction: reverse; }
  .tape.t3 { top: 4%; transform: rotate(4deg); opacity: .85; animation-duration: 3s; }
  .tape.t4 { bottom: 4%; transform: rotate(-3deg); opacity: .85; animation-duration: 3s; animation-direction: reverse; }
  @keyframes slide {
    from { background-position: 0 0; }
    to   { background-position: 79.2px 0; }
  }

  /* Card */
  .card {
    position: relative; z-index: 2;
    background: var(--card); color: var(--text);
    width: min(520px, 88vw);
    padding: 40px 32px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  .card img {
    max-width: 100%; width: 300px; height: auto;
    display: block; margin: 0 auto 24px;
  }
  .card p {
    margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="tape t3"></div>
  <div class="tape t1"></div>
  <div class="tape t2"></div>
  <div class="tape t4"></div>

  <main class="card">
    <img src="https://i.ibb.co/Rp57bbB2/COASTLINE-8.png" alt="Coastline logo">
    <p>After persistent feedback to bring back Canvas, this website is undergoing maintenance. Canvas is coming back soon.</p>
  </main>
</body>
</html>
