<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas State Roleplay - Live Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            min-height: 100vh;
            padding: 2rem;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            height: 50px;
            width: auto;
        }

        .brand h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .api-controls {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            background: #161a21;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            outline: none;
            width: 250px;
        }

        button {
            background: #0066ff;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #0052cc;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto 2rem auto;
        }

        .card {
            background: rgba(22, 26, 33, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .card h3 {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .card .stat {
            font-size: 2.2rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .tables-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel {
            background: rgba(22, 26, 33, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .panel h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        th {
            color: #64748b;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand">
            <img src="https://i.ibb.co/MD7JVW4J/LA-8.png" alt="Texas State Roleplay">
            <h1>TSRP Dashboard</h1>
        </div>
        <div class="api-controls">
            <input type="text" id="apiKeyInput" placeholder="Enter ER:LC Server Key">
            <button onclick="fetchData()">Connect</button>
        </div>
    </header>

    <div class="grid">
        <div class="card">
            <h3>Server Status</h3>
            <div class="stat" id="statStatus">Offline</div>
        </div>
        <div class="card">
            <h3>Active Players</h3>
            <div class="stat" id="statPlayers">0 / 0</div>
        </div>
        <div class="card">
            <h3>Queue</h3>
            <div class="stat" id="statQueue">0</div>
        </div>
        <div class="card">
            <h3>Vehicles Spawned</h3>
            <div class="stat" id="statVehicles">0</div>
        </div>
    </div>

    <div class="tables-container">
        <div class="panel">
            <h2>Active Players</h2>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Permission/Role</th>
                    </tr>
                </thead>
                <tbody id="playerTable">
                    <tr><td colspan="2">No data available</td></tr>
                </tbody>
            </table>
        </div>

        <div class="panel">
            <h2>Active Vehicles</h2>
            <table>
                <thead>
                    <tr>
                        <th>Owner</th>
                        <th>Vehicle Model</th>
                    </tr>
                </thead>
                <tbody id="vehicleTable">
                    <tr><td colspan="2">No data available</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchData() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('Please enter your ER:LC API Key.');
                return;
            }

            const headers = { 'Server-Key': apiKey };
            const baseUrl = 'https://api.policeroleplay.community/v1';

            try {
                // Fetch Server Details
                const serverRes = await fetch(`${baseUrl}/server`, { headers });
                const serverData = await serverRes.json();

                if (serverRes.ok) {
                    document.getElementById('statStatus').innerText = 'Online';
                    document.getElementById('statStatus').style.color = '#4ade80';
                    document.getElementById('statPlayers').innerText = `${serverData.CurrentPlayers} / ${serverData.MaxPlayers}`;
                    document.getElementById('statQueue').innerText = serverData.Queue || 0;
                } else {
                    document.getElementById('statStatus').innerText = 'Error';
                    document.getElementById('statStatus').style.color = '#f87171';
                }

                // Fetch Players
                const playersRes = await fetch(`${baseUrl}/server/players`, { headers });
                if (playersRes.ok) {
                    const players = await playersRes.json();
                    const playerTable = document.getElementById('playerTable');
                    playerTable.innerHTML = '';

                    if (players.length === 0) {
                        playerTable.innerHTML = '<tr><td colspan="2">No players online</td></tr>';
                    } else {
                        players.forEach(p => {
                            playerTable.innerHTML += `
                                <tr>
                                    <td><strong>${p.Player}</strong></td>
                                    <td>${p.Permission || 'Member'}</td>
                                </tr>`;
                        });
                    }
                }

                // Fetch Vehicles
                const vehiclesRes = await fetch(`${baseUrl}/server/vehicles`, { headers });
                if (vehiclesRes.ok) {
                    const vehicles = await vehiclesRes.json();
                    const vehicleTable = document.getElementById('vehicleTable');
                    document.getElementById('statVehicles').innerText = vehicles.length;
                    vehicleTable.innerHTML = '';

                    if (vehicles.length === 0) {
                        vehicleTable.innerHTML = '<tr><td colspan="2">No vehicles spawned</td></tr>';
                    } else {
                        vehicles.forEach(v => {
                            vehicleTable.innerHTML += `
                                <tr>
                                    <td>${v.Owner}</td>
                                    <td><strong>${v.Name}</strong></td>
                                </tr>`;
                        });
                    }
                }

            } catch (err) {
                console.error('API Fetch Error:', err);
                alert('Failed to connect to the ER:LC API. Check your key or CORS settings.');
            }
        }
    </script>
</body>
</html>
