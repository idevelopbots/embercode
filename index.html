<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waypoint - Home</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/1JsTfYVW/HSRP-6.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* Background */
body {
    font-family: "Inter", sans-serif;
    height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(circle at top left, #ffffff, #dfe9f3, #cfd9df, #e2ebf0);
    background-size: 400% 400%;
    animation: bgMove 20s infinite alternate ease;
}
@keyframes bgMove {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
}

/* Particles */
.particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: float 12s infinite ease-in-out;
}
@keyframes float {
    0% { transform: translateY(0) translateX(0); opacity: 0.4; }
    50% { opacity: 1; }
    100% { transform: translateY(-200px) translateX(80px); opacity: 0.2; }
}
.particle:nth-child(1) { top: 80%; left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { top: 60%; left: 30%; animation-delay: 2s; }
.particle:nth-child(3) { top: 70%; left: 50%; animation-delay: 4s; }
.particle:nth-child(4) { top: 85%; left: 70%; animation-delay: 1s; }
.particle:nth-child(5) { top: 65%; left: 90%; animation-delay: 3s; }

/* Navigation */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px 40px;
    display: flex;
    gap: 30px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.15);
    border-bottom: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}
nav a {
    color: #000;
    font-weight: 600;
    text-decoration: none;
    font-size: 1.1rem;
    transition: 0.3s;
}
nav a:hover {
    color: #444;
    transform: translateY(-2px);
}

/* Main panel */
.container {
    max-width: 900px;
    margin: 180px auto;
    padding: 50px;
    text-align: center;
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.25);
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    color: #000;
    transition: transform 0.15s ease-out;
    transform-style: preserve-3d;
}
h1 {
    font-size: 3.5rem;
    margin-bottom: 15px;
    text-shadow: 0 2px 10px rgba(255,255,255,0.7);
}
p {
    font-size: 1.3rem;
    margin-bottom: 30px;
}

/* Buttons */
.btn {
    display: inline-block;
    margin: 20px;
    padding: 18px 40px;
    background: #000;
    color: #fff;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    transition: 0.3s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: 2px solid transparent;
}
.btn:hover {
    background: #222;
    transform: translateY(-5px);
    border-color: #fff;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<nav>
    <a href="index.html">Home</a>
    <a href="tos.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="commands.html">Commands</a>
</nav>

<div class="container">
    <h1>Waypoint</h1>
    <p>Your server’s navigation assistant.</p>

    <a class="btn" href="https://discord.gg/3QV3XEteHx">Support Server</a>
    <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1542990189566099606&permissions=8&integration_type=0&scope=bot+applications.commands">Invite Bot</a>
</div>

<script>
document.addEventListener("mousemove", (e) => {
    const panel = document.querySelector(".container");
    if (!panel) return;

    const rect = panel.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const rotateX = ((y - centerY) / centerY) * 10;
    const rotateY = ((x - centerX) / centerX) * -10;

    panel.style.transform = `
        perspective(800px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        scale(1.03)
    `;
});

document.addEventListener("mouseleave", () => {
    const panel = document.querySelector(".container");
    if (!panel) return;
    panel.style.transform = `
        perspective(800px)
        rotateX(0deg)
        rotateY(0deg)
        scale(1)
    `;
});
</script>

</body>
</html>
