<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/Rp57bbB2/COASTLINE-8.png">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            font-family:Inter, "Segoe UI", sans-serif;
            overflow:hidden;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
        }

        /* Soft Premium Background */

        .background{
            position:fixed;
            inset:0;
            z-index:-2;

            background:linear-gradient(
                -45deg,
                #fef6f8,
                #fcf7ef,
                #fffdf7,
                #f5fcf5,
                #f5faff,
                #f8f5ff,
                #fff7fc
            );

            background-size:300% 300%;
            animation:gradientFlow 30s ease infinite;
        }

        .blob{
            position:absolute;
            border-radius:50%;
            filter:blur(150px);
            opacity:.18;
            mix-blend-mode:multiply;
        }

        .blob1{
            width:700px;
            height:700px;
            background:#ffdbe8;
            top:-250px;
            left:-200px;
            animation:float1 32s ease-in-out infinite;
        }

        .blob2{
            width:650px;
            height:650px;
            background:#dff1ff;
            right:-200px;
            top:15%;
            animation:float2 38s ease-in-out infinite;
        }

        .blob3{
            width:750px;
            height:750px;
            background:#ecffe0;
            bottom:-300px;
            left:20%;
            animation:float3 42s ease-in-out infinite;
        }

        .blob4{
            width:600px;
            height:600px;
            background:#efe3ff;
            top:35%;
            left:50%;
            animation:float4 35s ease-in-out infinite;
        }

        /* Floating Navigation */

        .navbar{
            position:fixed;
            top:25px;
            left:50%;
            transform:translateX(-50%);

            width:min(1000px,94%);
            z-index:100;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:14px 20px;

            background:rgba(255,255,255,.75);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,.5);
            border-radius:999px;

            box-shadow:
                0 12px 35px rgba(0,0,0,.06),
                inset 0 1px 0 rgba(255,255,255,.7);
        }

        .brand{
            display:flex;
            align-items:center;
            gap:12px;
            text-decoration:none;
            color:#181818;
            font-weight:800;
            font-size:1.15rem;
        }

        .brand img{
            width:38px;
            height:38px;
            object-fit:contain;
        }

        .nav-links{
            display:flex;
            gap:8px;
        }

        .nav-links a{
            text-decoration:none;
            color:#222;
            font-weight:600;
            padding:10px 16px;
            border-radius:999px;
            transition:.25s ease;
        }

        .nav-links a:hover{
            background:rgba(255,255,255,.8);
        }

        /* Hero Section */

        .hero{
            text-align:center;
            padding:20px;
            z-index:2;
        }

        .hero h1{
            font-size:clamp(3.2rem,8vw,6.5rem);
            font-weight:900;
            letter-spacing:-0.05em;
            color:#1d1d1f;
            margin-bottom:18px;
        }

        .hero p{
            color:#5f6368;
            font-size:1.1rem;
            margin-bottom:40px;
            max-width:600px;
        }

        .button-group{
            display:flex;
            justify-content:center;
            gap:16px;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            padding:16px 34px;
            border-radius:999px;
            font-weight:700;
            transition:.3s ease;
        }

        .btn-invite{
            background:#5865F2;
            color:white;
            box-shadow:0 10px 25px rgba(88,101,242,.25);
        }

        .btn-invite:hover{
            transform:translateY(-3px);
            box-shadow:0 16px 40px rgba(88,101,242,.3);
        }

        .btn-support{
            background:white;
            color:#111;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .btn-support:hover{
            transform:translateY(-3px);
            box-shadow:0 16px 35px rgba(0,0,0,.12);
        }

        @keyframes gradientFlow{
            0%{
                background-position:0% 50%;
            }
            50%{
                background-position:100% 50%;
            }
            100%{
                background-position:0% 50%;
            }
        }

        @keyframes float1{
            50%{
                transform:translate(150px,100px);
            }
        }

        @keyframes float2{
            50%{
                transform:translate(-150px,-80px);
            }
        }

        @keyframes float3{
            50%{
                transform:translate(120px,-130px);
            }
        }

        @keyframes float4{
            50%{
                transform:translate(-100px,100px);
            }
        }

        @media (max-width: 768px){

            .navbar{
                padding:12px 14px;
            }

            .brand span{
                display:none;
            }

            .nav-links{
                gap:2px;
            }

            .nav-links a{
                font-size:.85rem;
                padding:8px 10px;
            }

            .hero h1{
                font-size:3rem;
            }
        }
    </style>
</head>
<body>

    <div class="background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
        <div class="blob blob4"></div>
    </div>

    <nav class="navbar">
        <a href="#" class="brand">
            <img src="https://i.ibb.co/Rp57bbB2/COASTLINE-8.png" alt="Canvas Logo">
            <span>Canvas</span>
        </a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/terms">Terms of Service</a>
            <a href="/privacy">Privacy Policy</a>
        </div>
    </nav>

    <main class="hero">
        <h1>Give your server a paint job</h1>

        <p>
            Transform your Discord server with beautiful and customizable experiences.
        </p>

        <div class="button-group">

            <a
                class="btn btn-invite"
                href="https://discord.com/oauth2/authorize?client_id=1573438461489188976&permissions=8&integration_type=0&scope=applications.commands+bot"
                target="_blank"
                rel="noopener noreferrer">
                Invite
            </a>

            <a
                class="btn btn-support"
                href="https://discord.gg/GQ58Nk2hKD"
                target="_blank"
                rel="noopener noreferrer">
                Support
            </a>

        </div>
    </main>

</body>
</html>
