<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soft Rainbow Gradient</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:#000;
}

.gradient-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:linear-gradient(
        45deg,
        #ffd6e8,
        #ffe5c7,
        #fff7c2,
        #d8ffd6,
        #d6f5ff,
        #e4d6ff,
        #ffd6f5
    );
    background-size:400% 400%;
    animation:gradientShift 18s ease infinite;
}

.blob{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.5;
    mix-blend-mode:screen;
}

.blob1{
    background:#ffb3d9;
    top:-200px;
    left:-100px;
    animation:float1 16s infinite ease-in-out;
}

.blob2{
    background:#b8e1ff;
    top:30%;
    right:-150px;
    animation:float2 20s infinite ease-in-out;
}

.blob3{
    background:#d8ffc4;
    bottom:-250px;
    left:25%;
    animation:float3 18s infinite ease-in-out;
}

.blob4{
    background:#f5d0ff;
    top:50%;
    left:45%;
    animation:float4 22s infinite ease-in-out;
}

.content{
    position:relative;
    z-index:10;
    text-align:center;
    color:white;
}

h1{
    font-size:4rem;
    font-weight:300;
    text-shadow:0 4px 20px rgba(0,0,0,0.15);
}

p{
    margin-top:10px;
    font-size:1.2rem;
    opacity:0.9;
}

@keyframes gradientShift{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

@keyframes float1{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(200px,150px);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-250px,-100px);}
}

@keyframes float3{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(150px,-200px);}
}

@keyframes float4{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-180px,120px);}
}
</style>
</head>
<body>

<div class="gradient-bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="blob blob4"></div>
</div>

<div class="content">
    <h1>Soft Rainbow Dreams</h1>
    <p>Animated pastel gradients with floating colors</p>
</div>

</body>
</html>
