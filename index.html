<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Inter, Arial, sans-serif;
    background:#000;
}

.gradient-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:linear-gradient(
        45deg,
        #ffd6e8,
        #ffe5c7,
        #fff7c2,
        #d8ffd6,
        #d6f5ff,
        #e4d6ff,
        #ffd6f5
    );
    background-size:400% 400%;
    animation:gradientShift 18s ease infinite;
}

.blob{
    position:absolute;
    width:650px;
    height:650px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.55;
    mix-blend-mode:screen;
}

.blob1{
    background:#ffb3d9;
    top:-200px;
    left:-100px;
    animation:float1 16s ease-in-out infinite;
}

.blob2{
    background:#b8e1ff;
    top:20%;
    right:-150px;
    animation:float2 20s ease-in-out infinite;
}

.blob3{
    background:#d8ffc4;
    bottom:-250px;
    left:20%;
    animation:float3 18s ease-in-out infinite;
}

.blob4{
    background:#f5d0ff;
    top:50%;
    left:45%;
    animation:float4 22s ease-in-out infinite;
}

.content{
    position:relative;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:28px;
    padding:20px;
}

h1{
    font-size:clamp(3rem, 7vw, 6rem);
    font-weight:800;
    color:white;
    letter-spacing:-0.04em;
    text-shadow:0 10px 40px rgba(0,0,0,.15);
    max-width:900px;
}

.invite-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#444;
    font-size:1.1rem;
    font-weight:700;
    padding:16px 40px;
    border-radius:999px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.4);
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    transition:all .3s ease;
}

.invite-btn:hover{
    transform:translateY(-4px) scale(1.04);
    background:rgba(255,255,255,.9);
    box-shadow:0 20px 50px rgba(0,0,0,.18);
}

.invite-btn:active{
    transform:translateY(-1px) scale(1.01);
}

@keyframes gradientShift{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

@keyframes float1{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(220px,140px);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-260px,-120px);}
}

@keyframes float3{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(180px,-220px);}
}

@keyframes float4{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-200px,140px);}
}
</style>
</head>

<body>
<nav class="navbar">
    <div class="nav-brand">
        <img
            src="https://i.ibb.co/Rp57bbB2/COASTLINE-8.png"
            alt="Canvas Logo"
            class="nav-logo"
        >
        <span>Canvas</span>
    </div>
</nav>
<div class="gradient-bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="blob blob4"></div>
</div>

<div class="content">
    <h1>Give your server a paint job</h1>

    <a
        href="https://discord.com/oauth2/authorize?client_id=1573438461489188976&permissions=8&integration_type=0&scope=applications.commands+bot"
        target="_blank"
        rel="noopener noreferrer"
        class="invite-btn"
    >
        Invite Canvas
    </a>
</div>

</body>
</html>
