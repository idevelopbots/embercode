<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint - Home</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/1JsTfYVW/HSRP-6.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-color: #0b0f19;
    color: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* Dynamic Glowing Background Orbs */
.bg-glow {
    position: absolute;
    width: 500px;
    height: 500px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.25));
    filter: blur(100px);
    border-radius: 50%;
    z-index: -1;
    animation: pulseGlow 10s infinite alternate ease-in-out;
}
.glow-1 { top: -10%; left: -10%; }
.glow-2 { bottom: -10%; right: -10%; animation-delay: 5s; }

@keyframes pulseGlow {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.2); opacity: 1; }
}

/* Floating Particles */
.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    z-index: -1;
    animation: float 15s infinite linear;
}
@keyframes float {
    0% { transform: translateY(105vh) translateX(0); opacity: 0; }
    20% { opacity: 0.8; }
    80% { opacity: 0.8; }
    100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
}
.particle:nth-child(1) { left: 15%; animation-delay: 0s; }
.particle:nth-child(2) { left: 35%; animation-delay: 4s; width: 4px; height: 4px; }
.particle:nth-child(3) { left: 55%; animation-delay: 2s; }
.particle:nth-child(4) { left: 75%; animation-delay: 6s; width: 8px; height: 8px; }
.particle:nth-child(5) { left: 90%; animation-delay: 1s; }

/* Navigation */
nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    padding: 12px 28px;
    backdrop-filter: blur(16px);
    background: rgba(17, 24, 39, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    z-index: 100;
}
nav a {
    color: #9ca3af;
    font-weight: 500;
    text-decoration: none;
    font-size: 0.95rem;
    transition: all 0.25s ease;
}
nav a:hover {
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
}

/* Main Panel */
.container {
    width: 100%;
    max-width: 680px;
    margin: 40px 20px;
    padding: 60px 40px;
    text-align: center;
    backdrop-filter: blur(20px);
    background: rgba(17, 24, 39, 0.65);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: transform 0.1s ease-out;
    transform-style: preserve-3d;
}

/* Badge */
.badge {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(99, 102, 241, 0.15);
    color: #818cf8;
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

h1 {
    font-size: 3rem;
    font-weight: 800;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
}

p {
    font-size: 1.15rem;
    color: #9ca3af;
    margin-bottom: 35px;
    font-weight: 400;
}

/* Action Buttons Wrapper */
.btn-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 28px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.btn-primary {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.15);
}
.btn-primary:hover {
    background: linear-gradient(135deg, #4f46e5, #4338ca);
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: #f3f4f6;
    border: 1px solid rgba(255, 255, 255, 0.1);
}
.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 25px rgba(255, 255, 255, 0.05);
}

/* Responsive design adjustments */
@media(max-width: 600px) {
    h1 { font-size: 2.3rem; }
    .container { padding: 40px 20px; }
    nav { width: 90%; justify-content: space-around; padding: 12px 10px; }
}
</style>
</head>

<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<nav>
    <a href="index.html">Home</a>
    <a href="tos.html">Terms</a>
    <a href="privacy.html">Privacy</a>
    <a href="commands.html">Commands</a>
</nav>

<div class="container">
    <div class="badge">Discord Bot</div>
    <h1>Waypoint</h1>
    <p>Your ultimate server navigation and management assistant.</p>

    <div class="btn-group">
        <a class="btn btn-primary" href="https://discord.com/oauth2/authorize?client_id=1542990189566099606&permissions=8&integration_type=0&scope=bot+applications.commands">Invite Bot</a>
        <a class="btn btn-secondary" href="https://discord.gg/3QV3XEteHx">Support Server</a>
    </div>
</div>

<script>
document.addEventListener("mousemove", (e) => {
    const panel = document.querySelector(".container");
    if (!panel) return;

    const rect = panel.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const rotateX = ((y - centerY) / centerY) * 7;
    const rotateY = ((x - centerX) / centerX) * -7;

    panel.style.transform = `
        perspective(800px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        scale(1.02)
    `;
});

document.addEventListener("mouseleave", () => {
    const panel = document.querySelector(".container");
    if (!panel) return;
    panel.style.transform = `
        perspective(800px)
        rotateX(0deg)
        rotateY(0deg)
        scale(1)
    `;
});
</script>

</body>
</html>
