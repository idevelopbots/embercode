<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas - Embed Builder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            padding: 8px 16px;
            border-radius: 8px;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .builder-container {
            max-width: 1200px;
            width: 95%;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            flex: 1;
        }

        /* Editor Section */
        .editor-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .editor-card h2 {
            font-size: 1.5rem;
            color: #a855f7;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input[type="text"],
        .form-group textarea {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            border-color: #a855f7;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 1px solid #334155;
            border-radius: 8px;
        }

        .file-input {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .file-input::-webkit-file-upload-button {
            background: #a855f7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            font-weight: 500;
        }

        .btn-copy {
            background: linear-gradient(90deg, #a855f7, #6366f1);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-copy:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        /* Live Preview Section */
        .preview-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .preview-card h2 {
            font-size: 1.5rem;
            color: #6366f1;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .discord-wrapper {
            background: #313338;
            border-radius: 8px;
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .discord-author-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .bot-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
        }

        .bot-name {
            font-weight: 600;
            color: #f2f3f5;
            font-size: 1rem;
        }

        .bot-tag {
            background: #5865f2;
            color: white;
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 3px;
            margin-left: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Discord Embed Structure */
        .embed-container {
            background: #2b2d31;
            border-left: 4px solid #a855f7;
            border-radius: 4px;
            padding: 16px;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .embed-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .embed-author-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
        }

        .embed-author-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
        }

        .embed-title-wrapper {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            word-break: break-word;
        }

        .embed-title-wrapper a {
            color: #00a8fc;
            text-decoration: none;
        }

        .embed-title-wrapper a:hover {
            text-decoration: underline;
        }

        .embed-main-content {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .embed-description {
            font-size: 0.875rem;
            color: #dbdee1;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.35;
        }

        .embed-thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 4px;
            object-fit: cover;
            display: none;
            flex-shrink: 0;
        }

        .embed-image-container {
            margin-top: 8px;
        }

        .embed-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 4px;
            object-fit: cover;
            display: none;
        }

        .embed-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 0.75rem;
            color: #949ba4;
        }

        .embed-footer-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
        }

        @media (max-width: 900px) {
            .builder-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Canvas</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="embedbuilder.html" class="active">Embed Builder</a>
            <a href="tos.html">Terms of Service</a>
            <a href="privacypolicy.html">Privacy Policy</a>
        </nav>
    </header>

    <main class="builder-container">
        <section class="editor-card">
            <h2>Embed Customizer</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="embed-color">Sidebar Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="embed-color" value="#a855f7">
                        <input type="text" id="color-hex" value="#a855f7" style="width: 100%;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="author-name">Author Name</label>
                    <input type="text" id="author-name" placeholder="Author name">
                </div>
            </div>

            <div class="form-group">
                <label for="author-icon">Author Icon</label>
                <input type="file" id="author-icon" class="file-input" accept="image/*">
            </div>

            <div class="form-group">
                <label for="embed-title">Embed Title</label>
                <input type="text" id="embed-title" placeholder="Awesome Title">
            </div>

            <div class="form-group">
                <label for="title-url">Title URL</label>
                <input type="text" id="title-url" placeholder="https://example.com">
            </div>

            <div class="form-group">
                <label for="embed-description">Description</label>
                <textarea id="embed-description" placeholder="Type your embed description here..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="thumbnail-input">Thumbnail Image</label>
                    <input type="file" id="thumbnail-input" class="file-input" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="image-input">Main Image</label>
                    <input type="file" id="image-input" class="file-input" accept="image/*">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="footer-text">Footer Text</label>
                    <input type="text" id="footer-text" placeholder="Footer info">
                </div>
                <div class="form-group">
                    <label for="footer-icon">Footer Icon</label>
                    <input type="file" id="footer-icon" class="file-input" accept="image/*">
                </div>
            </div>

            <button id="copy-json-btn" class="btn-copy">Copy Embed JSON</button>
        </section>

        <section class="preview-card">
            <h2>Live Discord Preview</h2>

            <div class="discord-wrapper">
                <div class="discord-author-bar">
                    <div class="bot-avatar">C</div>
                    <div>
                        <span class="bot-name">Canvas</span>
                        <span class="bot-tag">BOT</span>
                    </div>
                </div>

                <div class="embed-container" id="preview-embed">
                    <div class="embed-header" id="preview-author-wrapper" style="display: none;">
                        <img id="preview-author-icon" class="embed-author-icon" src="" alt="Author">
                        <span id="preview-author-name" class="embed-author-name"></span>
                    </div>

                    <div id="preview-title-wrapper" class="embed-title-wrapper" style="display: none;">
                        <span id="preview-title"></span>
                    </div>

                    <div class="embed-main-content">
                        <div id="preview-description" class="embed-description" style="display: none;"></div>
                        <img id="preview-thumbnail" class="embed-thumbnail" src="" alt="Thumbnail">
                    </div>

                    <div class="embed-image-container">
                        <img id="preview-image" class="embed-image" src="" alt="Main Image">
                    </div>

                    <div id="preview-footer-wrapper" class="embed-footer" style="display: none;">
                        <img id="preview-footer-icon" class="embed-footer-icon" src="" alt="Footer Icon">
                        <span id="preview-footer-text"></span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Canvas Bot. All rights reserved.</p>
    </footer>

    <script>
        // DOM Elements
        const embedColor = document.getElementById('embed-color');
        const colorHex = document.getElementById('color-hex');
        const authorName = document.getElementById('author-name');
        const authorIcon = document.getElementById('author-icon');
        const embedTitle = document.getElementById('embed-title');
        const titleUrl = document.getElementById('title-url');
        const embedDescription = document.getElementById('embed-description');
        const thumbnailInput = document.getElementById('thumbnail-input');
        const imageInput = document.getElementById('image-input');
        const footerText = document.getElementById('footer-text');
        const footerIcon = document.getElementById('footer-icon');
        const copyJsonBtn = document.getElementById('copy-json-btn');

        // Preview Elements
        const previewEmbed = document.getElementById('preview-embed');
        const previewAuthorWrapper = document.getElementById('preview-author-wrapper');
        const previewAuthorName = document.getElementById('preview-author-name');
        const previewAuthorIcon = document.getElementById('preview-author-icon');
        const previewTitleWrapper = document.getElementById('preview-title-wrapper');
        const previewTitle = document.getElementById('preview-title');
        const previewDescription = document.getElementById('preview-description');
        const previewThumbnail = document.getElementById('preview-thumbnail');
        const previewImage = document.getElementById('preview-image');
        const previewFooterWrapper = document.getElementById('preview-footer-wrapper');
        const previewFooterText = document.getElementById('preview-footer-text');
        const previewFooterIcon = document.getElementById('preview-footer-icon');

        // Update Color
        function updateColor(val) {
            previewEmbed.style.borderColor = val;
            embedColor.value = val;
            colorHex.value = val;
        }

        embedColor.addEventListener('input', (e) => updateColor(e.target.value));
        colorHex.addEventListener('input', (e) => updateColor(e.target.value));

        // Update Author
        function updateAuthor() {
            const nameVal = authorName.value.trim();
            const hasIcon = previewAuthorIcon.style.display === 'block';

            if (nameVal || hasIcon) {
                previewAuthorWrapper.style.display = 'flex';
                previewAuthorName.textContent = nameVal;
            } else {
                previewAuthorWrapper.style.display = 'none';
            }
        }
        authorName.addEventListener('input', updateAuthor);

        // Update Title
        function updateTitle() {
            const titleVal = embedTitle.value.trim();
            const urlVal = titleUrl.value.trim();

            if (titleVal) {
                previewTitleWrapper.style.display = 'block';
                if (urlVal) {
                    previewTitle.innerHTML = `<a href="${urlVal}" target="_blank" rel="noopener noreferrer">${titleVal}</a>`;
                } else {
                    previewTitle.textContent = titleVal;
                }
            } else {
                previewTitleWrapper.style.display = 'none';
            }
        }
        embedTitle.addEventListener('input', updateTitle);
        titleUrl.addEventListener('input', updateTitle);

        // Update Description
        embedDescription.addEventListener('input', () => {
            const descVal = embedDescription.value;
            if (descVal.trim()) {
                previewDescription.style.display = 'block';
                previewDescription.textContent = descVal;
            } else {
                previewDescription.style.display = 'none';
            }
        });

        // Update Footer
        function updateFooter() {
            const textVal = footerText.value.trim();
            const hasIcon = previewFooterIcon.style.display === 'block';

            if (textVal || hasIcon) {
                previewFooterWrapper.style.display = 'flex';
                previewFooterText.textContent = textVal;
            } else {
                previewFooterWrapper.style.display = 'none';
            }
        }
        footerText.addEventListener('input', updateFooter);

        // Image Upload Handlers
        function handleImageUpload(inputEl, previewImgEl, onComplete) {
            inputEl.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        previewImgEl.src = evt.target.result;
                        previewImgEl.style.display = 'block';
                        if (onComplete) onComplete();
                    };
                    reader.readAsDataURL(file);
                } else {
                    previewImgEl.src = '';
                    previewImgEl.style.display = 'none';
                    if (onComplete) onComplete();
                }
            });
        }

        handleImageUpload(authorIcon, previewAuthorIcon, updateAuthor);
        handleImageUpload(thumbnailInput, previewThumbnail);
        handleImageUpload(imageInput, previewImage);
        handleImageUpload(footerIcon, previewFooterIcon, updateFooter);

        // Generate and Copy Embed JSON
        copyJsonBtn.addEventListener('click', () => {
            const hexColor = colorHex.value.replace('#', '');
            const colorInt = parseInt(hexColor, 16) || 0;

            const embedData = {};

            if (!isNaN(colorInt) && colorInt !== 0) {
                embedData.color = colorInt;
            }

            if (embedTitle.value.trim()) {
                embedData.title = embedTitle.value.trim();
            }

            if (titleUrl.value.trim()) {
                embedData.url = titleUrl.value.trim();
            }

            if (embedDescription.value.trim()) {
                embedData.description = embedDescription.value.trim();
            }

            if (authorName.value.trim() || previewAuthorIcon.src) {
                embedData.author = {};
                if (authorName.value.trim()) embedData.author.name = authorName.value.trim();
                if (previewAuthorIcon.src && previewAuthorIcon.style.display !== 'none') {
                    embedData.author.icon_url = previewAuthorIcon.src;
                }
            }

            if (previewThumbnail.src && previewThumbnail.style.display !== 'none') {
                embedData.thumbnail = { url: previewThumbnail.src };
            }

            if (previewImage.src && previewImage.style.display !== 'none') {
                embedData.image = { url: previewImage.src };
            }

            if (footerText.value.trim() || previewFooterIcon.src) {
                embedData.footer = {};
                if (footerText.value.trim()) embedData.footer.text = footerText.value.trim();
                if (previewFooterIcon.src && previewFooterIcon.style.display !== 'none') {
                    embedData.footer.icon_url = previewFooterIcon.src;
                }
            }

            const jsonString = JSON.stringify({ embeds: [embedData] }, null, 2);

            navigator.clipboard.writeText(jsonString).then(() => {
                const originalText = copyJsonBtn.textContent;
                copyJsonBtn.textContent = '✅ Copied to Clipboard!';
                setTimeout(() => {
                    copyJsonBtn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        });

        // Initialize default state
        updateColor('#a855f7');
    </script>
</body>
</html>
