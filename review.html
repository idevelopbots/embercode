<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Born a Crime - Chapter Study Station</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f6f9; color: #212529; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar-brand { font-weight: 700; color: #0d6efd !important; }
    
    /* Chapter Sidebar Navigation */
    .chapter-nav-btn {
      text-align: left;
      font-weight: 600;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #495057;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .chapter-nav-btn:hover { background-color: #e9ecef; color: #0d6efd; }
    .chapter-nav-btn.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
    
    /* Concept Cards */
    .study-card {
      background: white;
      border-radius: 14px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      margin-bottom: 1.5rem;
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .study-card:hover { transform: translateY(-2px); }
    .card-header-tag {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    /* Audio/Podcast Style Quick Quote Callout */
    .quote-box {
      background: #f8f9ff;
      border-left: 4px solid #0d6efd;
      padding: 1.25rem;
      border-radius: 0 10px 10px 0;
      font-style: italic;
    }
    
    /* Theme Badges */
    .badge-theme {
      background-color: #e7f1ff;
      color: #0d6efd;
      font-weight: 600;
      border-radius: 6px;
      padding: 0.4em 0.8em;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">Born a Crime Study Hub</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Practice Quiz</a>
        <a class="nav-link active" href="review.html">Study & Review</a>
      </div>
    </div>
  </nav>

  <div class="container py-2" style="max-width: 1100px;">
    
    <!-- Page Header -->
    <div class="text-center mb-4">
      <h2 class="fw-bold">Born a Crime Interactive Study Station</h2>
      <p class="text-muted">Explore core concepts, key quotes, and essential analysis by chapter.</p>
    </div>

    <div class="row g-4">
      
      <!-- Chapter Selector Sidebar -->
      <div class="col-lg-3">
        <div class="card p-3 shadow-sm border-0 sticky-top" style="top: 20px;">
          <h6 class="fw-bold text-muted mb-3 px-2">SELECT CHAPTER</h6>
          <div class="d-grid gap-2" id="chapterNav"></div>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="col-lg-9">
        
        <!-- Search & Filter Bar -->
        <div class="card p-3 shadow-sm border-0 mb-4">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search concepts, names, or keywords (e.g. pencil test, Hitler, cheese boy)..." onkeyup="filterStudyCards()">
          </div>
        </div>

        <!-- Dynamic Study Cards Container -->
        <div id="studyContent"></div>

      </div>
    </div>

  </div>

  <script>
    const studyModules = [
      {
        chapter: "Chapter 9",
        title: "Identity & Divide-and-Rule System",
        theme: "Systemic Racism & Social Manipulation",
        keyPoint: "How Apartheid Sowed Mistrust",
        explanation: "The government placed colored people above Black people in status to create jealousy, mistrust, and division, preventing oppressed groups from uniting against white supremacy.",
        quote: "When apartheid came, colored people defied easy categorization, so the system used them--quite brilliantly--to sow confusion, hatred, and mistrust.",
        takeaway: "The 'Pencil Test' was used to determine racial classification based on hair texture."
      },
      {
        chapter: "Chapter 11",
        chapterTitle: "Chapter 11",
        title: "Entrepreneurship & Social Survival",
        theme: "Adaptability & Social Mobility",
        keyPoint: "The Fast Kid & Canteen Food Dealer",
        explanation: "Trevor used his speed to beat the canteen lines and buy food for other students for a fee. This provided him with financial independence and made him popular across different social cliques.",
        quote: "I was like a weed dealer, but of food.",
        takeaway: "Being adaptable allowed Trevor to navigate rigid social structures at school."
      },
      {
        chapter: "Chapter 13",
        chapterTitle: "Chapter 13",
        title: "Race Perceptions & Systemic Bias",
        theme: "Racial Identity & Law Enforcement",
        keyPoint: "The Mall Theft & Video Footage",
        explanation: "When security guards reviewed black-and-white mall surveillance footage, Trevor's light skin made him look white on screen. As a result, authorities failed to realize he was the person right in front of them.",
        quote: "The footage made my light skin look white on camera.",
        takeaway: "Systemic bias and racial preconceptions distorted how law enforcement viewed evidence."
      },
      {
        chapter: "Chapter 15",
        chapterTitle: "Chapter 15",
        title: "Capitalism, Education & Cultural Context",
        theme: "Economic Inequality & Cultural Perspectives",
        keyPoint: "Flaw in 'Teach a Man to Fish' & Historical Perspectives",
        explanation: "Trevor points out that teaching someone to fish is useless without providing a fishing rod (capital/resources). Additionally, he explains why names like Hitler lacked negative connotations among Black South Africans who saw European powers primarily through an anti-colonial lens.",
        quote: "Give a man a fish, and he eats for a day. Teach a man to fish, and he eats for a lifetime... but you also need to give him a fishing rod.",
        takeaway: "Knowledge without access to capital or resources cannot break cycles of poverty."
      },
      {
        chapter: "Chapter 16",
        chapterTitle: "Chapter 16",
        title: "The Hood & Economic Reality",
        theme: "Township Culture & Informal Economies",
        keyPoint: "Cheese Boys & Why 'Crime Cares'",
        explanation: "A 'cheese boy' is township slang for someone from a slightly more affluent family who can afford luxury items like cheese. Trevor notes that 'crime cares' because criminal hustling was often the only system in the hood providing youth with opportunity and support when government systems failed.",
        quote: "Crime succeeds because crime does the one thing the government doesn't do: crime cares.",
        takeaway: "Under-resourced communities build informal economies when official systems abandon them."
      },
      {
        chapter: "Chapter 17",
        chapterTitle: "Chapter 17",
        title: "Language as a Shield & Systemic Justice",
        theme: "Communication & Power Dynamics",
        keyPoint: "Surviving Jail & De-escalating Danger",
        explanation: "Trevor de-escalated potential violence in jail by speaking fluent Zulu to a large, intimidating inmate. Language allowed him to bridge racial/cultural divides and protect himself in hostile environments.",
        quote: "Language brings with it an identity and a culture that centralizes human connection.",
        takeaway: "Mastering multiple languages served as Trevor's primary tool for self-defense and social connection."
      },
      {
        chapter: "Chapter 18",
        chapterTitle: "Chapter 18",
        title: "Domestic Violence & Maternal Strength",
        theme: "Family Dynamics & Resilience",
        keyPoint: "Abel's Patriarchal Control & Patricia's Choice",
        explanation: "Trevor opposed his mother marrying Abel after recognizing Abel's traditional, controlling mindset and dangerous temper. The chapter highlights the lingering systemic impacts of apartheid on family structures and personal safety.",
        quote: "My mother chose to live a life governed by love, not fear.",
        takeaway: "Personal resilience and maternal love remained central despite severe systemic and domestic hardships."
      }
    ];

    let activeChapter = "ALL";

    function initSidebar() {
      const nav = document.getElementById('chapterNav');
      const chapters = ["ALL", "Chapter 9", "Chapter 11", "Chapter 13", "Chapter 15", "Chapter 16", "Chapter 17", "Chapter 18"];
      
      nav.innerHTML = chapters.map(chap => `
        <button class="btn chapter-nav-btn ${chap === 'ALL' ? 'active' : ''}" onclick="selectChapter('${chap}', this)">
          <i class="bi bi-journal-text me-2"></i> ${chap === 'ALL' ? 'All Chapters' : chap}
        </button>
      `).join('');
    }

    function selectChapter(chap, btnEl) {
      activeChapter = chap;
      document.querySelectorAll('.chapter-nav-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      renderContent();
    }

    function renderContent() {
      const container = document.getElementById('studyContent');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = studyModules.filter(m => {
        const matchesChap = activeChapter === "ALL" || m.chapter === activeChapter;
        const matchesSearch = m.title.toLowerCase().includes(searchQuery) ||
                              m.explanation.toLowerCase().includes(searchQuery) ||
                              m.keyPoint.toLowerCase().includes(searchQuery) ||
                              m.chapter.toLowerCase().includes(searchQuery);
        return matchesChap && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="card p-5 text-center border-0 shadow-sm">
            <i class="bi bi-search fs-1 text-muted mb-2"></i>
            <h5>No study modules found</h5>
            <p class="text-muted mb-0">Try clearing your search query or selecting a different chapter.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(m => `
        <div class="study-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge badge-theme">${m.chapter}</span>
            <span class="card-header-tag text-muted"><i class="bi bi-bookmark-fill text-primary me-1"></i> ${m.theme}</span>
          </div>

          <h4 class="fw-bold text-dark mb-2">${m.title}</h4>
          <h6 class="fw-bold text-primary mb-3">${m.keyPoint}</h6>

          <p class="text-secondary lh-base mb-3">${m.explanation}</p>

          <div class="quote-box mb-3">
            <p class="mb-1 text-dark">"${m.quote}"</p>
            <small class="text-muted fw-semibold">— Trevor Noah, Born a Crime</small>
          </div>

          <div class="p-3 bg-light rounded-3 d-flex align-items-center gap-2">
            <i class="bi bi-lightbulb-fill text-warning fs-5"></i>
            <div>
              <strong class="d-block text-dark small">Key Takeaway for Exams:</strong>
              <span class="small text-muted">${m.takeaway}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterStudyCards() {
      renderContent();
    }

    initSidebar();
    renderContent();
  </script>
</body>
</html>
