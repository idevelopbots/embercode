<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas - Commands</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            padding: 8px 16px;
            border-radius: 8px;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .page-container {
            max-width: 1200px;
            width: 95%;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
        }

        .section-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .commands-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            flex-wrap: wrap;
        }

        .commands-controls h2 {
            font-size: 1.5rem;
            color: #a855f7;
            border: none;
            padding: 0;
            margin: 0;
        }

        .search-input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            width: 250px;
        }

        .search-input:focus {
            border-color: #a855f7;
        }

        /* Commands Grid */
        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .command-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .command-card:hover {
            transform: translateY(-2px);
            border-color: #a855f7;
        }

        .command-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #a855f7;
            font-family: monospace;
            word-break: break-all;
        }

        .command-description {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .command-tag {
            align-self: flex-start;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 40px;
            grid-column: 1 / -1;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Canvas</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="commands.html" class="active">Commands</a>
            <a href="tos.html">Terms of Service</a>
            <a href="privacypolicy.html">Privacy Policy</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="section-card">
            <div class="commands-controls">
                <h2>Bot Commands (<span id="command-count">0</span>)</h2>
                <input type="text" id="search-bar" class="search-input" placeholder="🔍 Search commands...">
            </div>

            <div class="command-grid" id="command-grid">
                <div class="empty-state" id="empty-state">
                    No commands found.
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Canvas Bot. All rights reserved.</p>
    </footer>

    <script>
        // =========================================================
        // ✏️ ADD YOUR COMMAND CARDS IN THIS CODE ARRAY BELOW!
        // =========================================================
        const MY_COMMANDS = [
            {
                title: "/help",
                category: "General",
                description: "Lists all available commands and bot features."
            },
            {
                title: "/ban",
                category: "Moderation",
                description: "Bans a specified user from the Discord server."
            },
            {
                title: "/kick",
                category: "Moderation",
                description: "Kicks a member out of the server."
            },
            {
                title: "/play",
                category: "Music",
                description: "Plays audio from a YouTube or Spotify URL."
            },
            {
                title: "/ping",
                category: "Utility",
                description: "Checks the bot latency and API response time."
            },
            // 💡 Copy and paste this block below to add a new command:
            /*
            {
                title: "/command-name",
                category: "Category Name",
                description: "Type description here."
            },
            */
        ];
        // =========================================================

        const commandGrid = document.getElementById('command-grid');
        const emptyState = document.getElementById('empty-state');
        const commandCount = document.getElementById('command-count');
        const searchBar = document.getElementById('search-bar');

        function renderCommands() {
            commandGrid.innerHTML = '';
            const query = searchBar.value.toLowerCase().trim();

            const filteredCommands = MY_COMMANDS.filter(cmd => 
                cmd.title.toLowerCase().includes(query) ||
                cmd.category.toLowerCase().includes(query) ||
                cmd.description.toLowerCase().includes(query)
            );

            commandCount.textContent = filteredCommands.length;

            if (filteredCommands.length === 0) {
                emptyState.style.display = 'block';
                commandGrid.appendChild(emptyState);
                return;
            }

            emptyState.style.display = 'none';

            filteredCommands.forEach(cmd => {
                const card = document.createElement('div');
                card.className = 'command-card';

                const titleEl = document.createElement('div');
                titleEl.className = 'command-title';
                titleEl.textContent = cmd.title;
                card.appendChild(titleEl);

                if (cmd.category && cmd.category.trim()) {
                    const tag = document.createElement('span');
                    tag.className = 'command-tag';
                    tag.textContent = cmd.category.trim();
                    card.appendChild(tag);
                }

                const descEl = document.createElement('div');
                descEl.className = 'command-description';
                descEl.textContent = cmd.description;
                card.appendChild(descEl);

                commandGrid.appendChild(card);
            });
        }

        searchBar.addEventListener('input', renderCommands);

        // Initial render
        renderCommands();
    </script>
</body>
</html>
