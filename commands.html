<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas - Commands</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            padding: 8px 16px;
            border-radius: 8px;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .page-container {
            max-width: 1200px;
            width: 95%;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
        }

        .top-controls {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .top-controls h2 {
            font-size: 1.5rem;
            color: #a855f7;
        }

        .search-input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            width: 280px;
        }

        .search-input:focus {
            border-color: #a855f7;
        }

        /* Category Divider Section */
        .category-section {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        .category-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-count {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Divided Stack Layout */
        .command-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .command-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-left: 4px solid #a855f7;
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .command-card:hover {
            border-color: #a855f7;
            transform: translateX(4px);
        }

        .command-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #a855f7;
            font-family: monospace;
        }

        .command-description {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 40px;
            font-size: 1rem;
            background: #1e293b;
            border-radius: 16px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Canvas</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="commands.html" class="active">Commands</a>
            <a href="tos.html">Terms of Service</a>
            <a href="privacypolicy.html">Privacy Policy</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="top-controls">
            <h2>Bot Commands (<span id="total-count">0</span>)</h2>
            <input type="text" id="search-bar" class="search-input" placeholder="🔍 Search commands...">
        </section>

        <div id="category-container" style="display: flex; flex-direction: column; gap: 24px;"></div>

        <div class="empty-state" id="empty-state" style="display: none;">
            No commands found.
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Canvas Bot. All rights reserved.</p>
    </footer>

    <script>
        // =========================================================
        // ✏️ ADD / EDIT YOUR COMMAND CARDS HERE IN THE CODE!
        // Categories available: "Social", "Utility", "Moderation"
        // =========================================================
        const MY_COMMANDS = [
            // --- SOCIAL ---
            { 
                title: "/profile", 
                category: "Social", 
                description: "Displays a user's profile card, level, and custom bio." 
            },
            { 
                title: "/rank", 
                category: "Social", 
                description: "Shows your current rank and XP standing on the server leaderboard." 
            },

            // --- UTILITY ---
            { 
                title: "/help", 
                category: "Utility", 
                description: "Lists all available commands and bot features." 
            },
            { 
                title: "/ping", 
                category: "Utility", 
                description: "Checks the bot latency and API response time." 
            },
            { 
                title: "/serverinfo", 
                category: "Utility", 
                description: "Provides detailed information and statistics about the server." 
            },

            // --- MODERATION ---
            { 
                title: "/ban", 
                category: "Moderation", 
                description: "Bans a specified member from the server." 
            },
            { 
                title: "/kick", 
                category: "Moderation", 
                description: "Kicks a member out of the server." 
            },
            { 
                title: "/warn", 
                category: "Moderation", 
                description: "Issues an official warning to a user." 
            },

            // Add more below:
            /*
            { title: "/command-name", category: "Social", description: "Your description here." },
            { title: "/command-name", category: "Utility", description: "Your description here." },
            { title: "/command-name", category: "Moderation", description: "Your description here." },
            */
        ];
        // =========================================================

        // Fixed display order for categories
        const CATEGORY_ORDER = ["Social", "Utility", "Moderation"];

        const categoryContainer = document.getElementById('category-container');
        const emptyState = document.getElementById('empty-state');
        const totalCount = document.getElementById('total-count');
        const searchBar = document.getElementById('search-bar');

        function renderDividedCommands() {
            categoryContainer.innerHTML = '';
            const query = searchBar.value.toLowerCase().trim();

            // Filter commands based on search query
            const filteredCommands = MY_COMMANDS.filter(cmd => 
                cmd.title.toLowerCase().includes(query) ||
                cmd.category.toLowerCase().includes(query) ||
                cmd.description.toLowerCase().includes(query)
            );

            totalCount.textContent = filteredCommands.length;

            if (filteredCommands.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            // Group commands by category
            const categories = {};
            filteredCommands.forEach(cmd => {
                const cat = cmd.category.trim() || "Other";
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(cmd);
            });

            // Get categories to display (following predefined order)
            const activeCategories = CATEGORY_ORDER.filter(cat => categories[cat] && categories[cat].length > 0);
            
            // Catch any unexpected categories not in CATEGORY_ORDER
            Object.keys(categories).forEach(cat => {
                if (!activeCategories.includes(cat) && categories[cat].length > 0) {
                    activeCategories.push(cat);
                }
            });

            // Build divided category sections
            activeCategories.forEach(catName => {
                const section = document.createElement('section');
                section.className = 'category-section';

                // Category Header
                const header = document.createElement('div');
                header.className = 'category-header';

                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = catName;

                const count = document.createElement('span');
                count.className = 'category-count';
                count.textContent = `${categories[catName].length} command${categories[catName].length > 1 ? 's' : ''}`;

                header.appendChild(title);
                header.appendChild(count);
                section.appendChild(header);

                // Command List Block
                const list = document.createElement('div');
                list.className = 'command-list';

                categories[catName].forEach(cmd => {
                    const card = document.createElement('div');
                    card.className = 'command-card';

                    const cmdTitle = document.createElement('div');
                    cmdTitle.className = 'command-title';
                    cmdTitle.textContent = cmd.title;

                    const cmdDesc = document.createElement('div');
                    cmdDesc.className = 'command-description';
                    cmdDesc.textContent = cmd.description;

                    card.appendChild(cmdTitle);
                    card.appendChild(cmdDesc);
                    list.appendChild(card);
                });

                section.appendChild(list);
                categoryContainer.appendChild(section);
            });
        }

        searchBar.addEventListener('input', renderDividedCommands);

        // Initial render
        renderDividedCommands();
    </script>
</body>
</html>
